version = "9.0.1-ounce"
repo = "https://github.com/xlanor/FFmpeg.git"
ref = "ffmpeg-9.0.1"
commit = "17cce46d05feba9ae941d8b4ed49336bfcbf8924"
kind = "configure"
host_flag = false
configure_flags = [
  "--enable-gpl",
  "--enable-version3",
  "--cross-prefix=aarch64-none-elf-",
  "--enable-cross-compile",
  "--arch=aarch64",
  "--cpu=cortex-a78c",
  "--target-os=horizon",
  "--enable-pic",
  "--extra-cflags=-D__SWITCH__ -D__SWITCH2__ -D_GNU_SOURCE -O2 -mcpu=cortex-a78c+crypto -mtp=soft -fPIC -ftls-model=local-exec -isystem /opt/devkitpro/libounce/include",
  "--extra-cxxflags=-D__SWITCH__ -D__SWITCH2__ -D_GNU_SOURCE -O2 -mcpu=cortex-a78c+crypto -mtp=soft -fPIC -ftls-model=local-exec -isystem /opt/devkitpro/libounce/include",
  "--extra-ldflags=-fPIE -L/opt/devkitpro/portlibs/switch2/lib -L/opt/devkitpro/libounce/lib",
  "--disable-runtime-cpudetect",
  "--disable-programs",
  "--disable-debug",
  "--disable-doc",
  "--enable-asm",
  "--enable-neon",
  "--disable-autodetect",
  "--disable-everything",
  "--disable-avdevice",
  "--disable-encoders",
  "--disable-muxers",
  "--enable-decoder=h264,hevc",
  "--enable-parser=h264,hevc",
  "--enable-swscale",
  "--enable-swresample",
  "--disable-network",
  "--disable-nvtegra",
]
